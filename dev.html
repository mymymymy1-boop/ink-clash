<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>INK CLASH</title>
<style>
  :root { --a: #FF6B1A; --b: #00B8A9; --bg: #14141a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: #eee; font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #wrap { position: relative; width: min(96vw, 1280px); }
  canvas { width: 100%; display: block; border-radius: 10px; background: #23232c; cursor: crosshair; }

  /* HUD */
  #hud-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
             display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; width: 50%; }
  #time { font-size: 30px; font-weight: 800; text-shadow: 0 2px 6px #000a; }
  #ratio { width: 100%; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: #ffffff22; }
  #ratio-a { background: var(--a); height: 100%; transition: width .3s; }
  #ratio-b { background: var(--b); height: 100%; flex: 1; transition: width .3s; }
  #ratio-pcts { width: 100%; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
  #ratio-a-pct { color: var(--a); } #ratio-b-pct { color: var(--b); }

  #hud-bl { position: absolute; left: 14px; bottom: 14px; width: 220px; pointer-events: none; }
  #hud-br { position: absolute; right: 14px; bottom: 14px; width: 180px; pointer-events: none; }
  .bar-label { font-size: 11px; opacity: .85; margin-bottom: 2px; letter-spacing: .08em; }
  .bar { height: 12px; background: #ffffff22; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .bar > div { height: 100%; transition: width .12s; }
  #ink-bar { background: var(--a); width: 100%; }
  #hp-bar { background: #6fe06f; width: 100%; }
  #sp-bar { background: #ffd23e; width: 0%; }
  #sp-wrap.ready .bar { box-shadow: 0 0 12px #ffd23e; }
  #sp-wrap.ready .bar-label::after { content: '  [E] 発動！'; color: #ffd23e; }

  #respawn { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             background: #000a; border-radius: 10px; font-size: 26px; font-weight: 800; }
  #respawn.on { display: flex; }

  /* 画面オーバーレイ */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
            justify-content: center; gap: 18px; background: #101018ee; border-radius: 10px; }
  .screen.on { display: flex; }
  #title-name { font-size: 64px; font-weight: 900; letter-spacing: .04em;
    background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { opacity: .8; font-size: 14px; }
  #weapons { display: flex; gap: 12px; }
  [data-weapon] { background: #23232c; color: #eee; border: 2px solid #444; border-radius: 10px;
    padding: 14px 18px; cursor: pointer; font-size: 14px; width: 170px; }
  [data-weapon]:hover { border-color: #888; }
  [data-weapon].sel { border-color: var(--a); box-shadow: 0 0 10px #ff6b1a55; }
  .wname { font-weight: 800; font-size: 16px; display: block; margin-bottom: 4px; }
  .wdesc { font-size: 11px; opacity: .75; }
  button.big { background: linear-gradient(90deg, var(--a), #ff9c1a); border: none; color: #fff;
    font-size: 20px; font-weight: 800; padding: 12px 48px; border-radius: 999px; cursor: pointer; }
  button.big:hover { filter: brightness(1.1); }
  #controls { font-size: 12px; opacity: .7; line-height: 1.8; text-align: center; }
  #result-title { font-size: 56px; font-weight: 900; }
  #result-bar { width: 60%; height: 22px; border-radius: 11px; overflow: hidden; display: flex; background: var(--b); }
  #result-bar-a { background: var(--a); height: 100%; }
  #result-pcts { width: 60%; display: flex; justify-content: space-between; font-weight: 700; }
  #result-a { color: var(--a); } #result-b { color: var(--b); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud-top">
    <div id="time">3:00</div>
    <div id="ratio"><div id="ratio-a"></div><div id="ratio-b"></div></div>
    <div id="ratio-pcts"><span id="ratio-a-pct">0%</span><span id="ratio-b-pct">0%</span></div>
  </div>
  <div id="hud-bl">
    <div class="bar-label">インク</div><div class="bar"><div id="ink-bar"></div></div>
    <div class="bar-label">HP</div><div class="bar"><div id="hp-bar"></div></div>
  </div>
  <div id="hud-br"><div id="sp-wrap">
    <div class="bar-label">スペシャル</div><div class="bar"><div id="sp-bar"></div></div>
  </div></div>
  <div id="respawn">復活まで <span id="respawn-n">3</span> 秒</div>

  <div id="title" class="screen on">
    <div id="title-name">INK CLASH</div>
    <div class="sub">インクを塗り合う4v4対戦！ 3分間でより広く塗ったチームの勝ち</div>
    <div id="weapons">
      <button data-weapon="shooter"><span class="wname"></span><span class="wdesc">連射が利く万能タイプ。迷ったらこれ</span></button>
      <button data-weapon="roller"><span class="wname"></span><span class="wdesc">走るだけで道を塗る。近づいて一撃必倒</span></button>
      <button data-weapon="charger"><span class="wname"></span><span class="wdesc">長押しでチャージ。最長射程の一閃</span></button>
    </div>
    <button id="start" class="big">バトル開始</button>
    <div id="controls">
      移動: W A S D ／ エイム: マウス ／ 射撃: 左クリック<br>
      潜行(自インクで高速移動＆回復): Space ／ スペシャル: E
    </div>
  </div>

  <div id="result" class="screen">
    <div id="result-title"></div>
    <div id="result-bar"><div id="result-bar-a"></div></div>
    <div id="result-pcts"><span id="result-a"></span><span id="result-b"></span></div>
    <button id="rematch" class="big">もう一回</button>
  </div>
</div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
