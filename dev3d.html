<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>INK CLASH</title>
<style>
  :root { --a: #FF6B1A; --b: #00B8A9; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #10101a; color: #eee;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #touch-layer { position: fixed; inset: 0; }
  .hidden { display: none !important; }

  /* 仮想スティック（FR-TOUCH-001） */
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid #ffffff44; background: #ffffff12; display: none; pointer-events: none; }
  #stick.on { display: block; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: #ffffff66; }

  /* ボタン（FR-TOUCH-002） */
  .btn { position: fixed; border-radius: 50%; border: 2px solid #ffffff55; background: #ffffff1c;
    color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; z-index: 5; }
  .btn.pressed { background: #ffffff45; }
  #btn-fire { right: max(20px, env(safe-area-inset-right)); bottom: 86px; width: 96px; height: 96px;
    font-size: 17px; background: #ff6b1a3d; border-color: var(--a); }
  #btn-fire.pressed { background: #ff6b1a88; }
  #btn-jump { right: 128px; bottom: 36px; width: 76px; height: 76px; font-size: 13px;
    background: #ffffff22; border-color: #fff; }
  #btn-jump.pressed { background: #ffffff55; }
  #btn-swim { right: 224px; bottom: 110px; width: 62px; height: 62px; font-size: 11px;
    background: #00b8a92e; border-color: var(--b); }
  #btn-swim.pressed { background: #00b8a980; }
  #btn-sp { right: 36px; bottom: 206px; width: 64px; height: 64px; font-size: 11px;
    background: conic-gradient(#ffd23e calc(var(--p, 0) * 1%), #ffffff18 0); border-color: #ffd23e; }
  #btn-mute { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ffffff44; background: #ffffff14;
    color: #fff; font-size: 17px; z-index: 11; }
  #btn-sp.ready { box-shadow: 0 0 18px #ffd23e; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #sp-ring { position: absolute; inset: 4px; border-radius: 50%; background: #10101adb;
    display: flex; align-items: center; justify-content: center; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #hud-top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 3px; width: min(46%, 420px); }
  #time { font-size: 24px; font-weight: 800; text-shadow: 0 2px 6px #000c; }
  #ratio { width: 100%; height: 10px; border-radius: 5px; overflow: hidden; display: flex; background: #ffffff22; }
  #ratio-a { background: var(--a); height: 100%; transition: width .3s; }
  #ratio-b { background: var(--b); height: 100%; flex: 1; transition: width .3s; }
  #ratio-pcts { width: 100%; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800;
    text-shadow: 0 1px 3px #000c, 0 0 6px #0008; }
  #ratio-a-pct { color: var(--a); } #ratio-b-pct { color: var(--b); }
  #hud-bl { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); width: 132px;
    background: rgba(12,12,22,.38); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(4px); }
  .bar-label { font-size: 9px; opacity: .8; margin-bottom: 2px; letter-spacing: .1em; }
  .bar { height: 8px; background: #ffffff22; border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
  .bar > div { height: 100%; transition: width .12s; }
  #ink-bar { background: var(--a); width: 100%; }
  #hp-bar { background: #6fe06f; width: 100%; }
  #respawn { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #0009; font-size: 22px; font-weight: 800; z-index: 6; }
  #respawn.on { display: flex; }

  /* v3.2: 画面の品(ビネット) */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(10,10,20,.22) 100%); }

  /* v10: 被弾フィードバック（赤い縁のフラッシュ） */
  #damage-flash { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(220,30,30,.55) 100%);
    transition: opacity .35s ease-out; }
  #damage-flash.hit { opacity: 1; transition: opacity .05s; }

  /* v3.2: 横画面が基本。縦持ちのスマホには回転を促す（タッチ端末のみ） */
  #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: #101018; z-index: 99; text-align: center; }
  #rotate .phone { font-size: 64px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
  #rotate .msg { font-size: 18px; font-weight: 800; }
  #rotate .sub2 { font-size: 13px; opacity: .7; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }

  /* 画面 */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #101018f2; z-index: 10; padding: 12px; }
  .screen.on { display: flex; }
  #title-name { font-size: clamp(38px, 9vw, 64px); font-weight: 900; letter-spacing: .04em;
    background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { opacity: .8; font-size: 13px; text-align: center; }
  #weapons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  [data-weapon] { background: #23232c; color: #eee; border: 2px solid #444; border-radius: 10px;
    padding: 10px 12px; cursor: pointer; font-size: 12px; width: 150px; }
  [data-weapon].sel { border-color: var(--a); box-shadow: 0 0 10px #ff6b1a55; }
  .wname { font-weight: 800; font-size: 14px; display: block; margin-bottom: 3px; }
  .wdesc { font-size: 10px; opacity: .75; }
  button.big { background: linear-gradient(90deg, var(--a), #ff9c1a); border: none; color: #fff;
    font-size: 18px; font-weight: 800; padding: 12px 44px; border-radius: 999px; cursor: pointer; }
  #controls-hint { font-size: 11px; opacity: .7; line-height: 1.7; text-align: center; }
  #result-title { font-size: clamp(40px, 10vw, 56px); font-weight: 900; }
  #result-bar { width: 70%; max-width: 420px; height: 18px; border-radius: 9px; overflow: hidden; display: flex; background: var(--b); }
  #result-bar-a { background: var(--a); height: 100%; }
  #result-pcts { width: 70%; max-width: 420px; display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
  #result-a { color: var(--a); } #result-b { color: var(--b); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="damage-flash"></div>
<div id="touch-layer"></div>
<div id="stick"><div id="stick-knob"></div></div>

<div id="rotate">
  <div class="phone">📱</div>
  <div class="msg">スマホを横向きにしてください</div>
  <div class="sub2">このゲームは横画面専用です</div>
</div>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div id="time">3:00</div>
    <div id="ratio"><div id="ratio-a"></div><div id="ratio-b"></div></div>
    <div id="ratio-pcts"><span id="ratio-a-pct">0%</span><span id="ratio-b-pct">0%</span></div>
  </div>
  <div id="hud-bl">
    <div class="bar-label">インク</div><div class="bar"><div id="ink-bar"></div></div>
    <div class="bar-label">HP</div><div class="bar"><div id="hp-bar"></div></div>
  </div>
</div>
<button id="btn-fire" class="btn">ショット</button>
<button id="btn-jump" class="btn">ジャンプ</button>
<button id="btn-swim" class="btn">潜行</button>
<button id="btn-sp" class="btn"><span id="sp-ring">SP</span></button>
<button id="btn-mute">🔊</button>
<div id="respawn">復活まで <span id="respawn-n">3</span> 秒</div>

<div id="title" class="screen on">
  <div id="title-name">INK CLASH</div>
  <div class="sub">インクを塗り合う4v4対戦！ 3分間でより広く塗ったチームの勝ち</div>
  <div id="weapons">
    <button data-weapon="shooter"><span class="wname"></span><span class="wdesc">連射が利く万能タイプ</span></button>
    <button data-weapon="roller"><span class="wname"></span><span class="wdesc">走るだけで道を塗る・一撃必倒</span></button>
    <button data-weapon="charger"><span class="wname"></span><span class="wdesc">長押しチャージ・最長射程</span></button>
    <button data-weapon="slosher"><span class="wname"></span><span class="wdesc">山なり投擲・壁の向こうも塗れる</span></button>
    <button data-weapon="spinner"><span class="wname"></span><span class="wdesc">スピンアップ後に超連射</span></button>
    <button data-weapon="blaster"><span class="wname"></span><span class="wdesc">着弾爆発・範囲ダメージ</span></button>
    <button data-weapon="brush"><span class="wname"></span><span class="wdesc">超高速・短射程の接近塗り</span></button>
    <button data-weapon="dualies"><span class="wname"></span><span class="wdesc">2発同時の扇射・中射程</span></button>
    <button data-weapon="stringer"><span class="wname"></span><span class="wdesc">チャージ3本同時・面制圧</span></button>
  </div>
  <div style="font-size: 12px; opacity: 0.8; margin-top: 8px;">スペシャル:</div>
  <div id="specials" style="width: 100%; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
    <button data-special="storm" style="padding: 6px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 11px;">⚡ インクストーム</button>
    <button data-special="barrier" style="padding: 6px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 11px;">🛡️ インクバリア</button>
  </div>
  <div id="stage-select" style="width: 100%; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px;">
    <button data-stage="1" style="padding: 8px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">🏔️ Pyramid Arena</button>
    <button data-stage="2" style="padding: 8px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">⛰️ Split Peaks</button>
    <button data-stage="3" style="padding: 8px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">🏜️ Canyon Cross</button>
    <button data-stage="4" style="padding: 8px 12px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">🌀 Ink Maze</button>
  </div>
  <div style="font-size: 12px; opacity: 0.8; margin-top: 8px;">難易度:</div>
  <div id="difficulty-select" style="width: 100%; display: flex; gap: 8px; justify-content: center;">
    <button data-diff="EASY" style="padding: 6px 16px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">かんたん</button>
    <button data-diff="NORMAL" style="padding: 6px 16px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">ふつう</button>
    <button data-diff="HARD" style="padding: 6px 16px; border-radius: 8px; border: 2px solid #444; background: #23232c; color: #eee; cursor: pointer; font-size: 12px;">むずかしい</button>
  </div>
  <button id="start" class="big">バトル開始</button>
  <div id="controls-hint">
    【スマホ】左半分: スティックで移動 ／ 右半分: スワイプで視点旋回 ／ ボタンで ショット・ジャンプ・潜行・SP<br>
    【PC】マウス移動で旋回 ／ 左クリック長押しで前進 ／ 右クリックで潜行 ／ ホイールクリックでSP<br>
    　　　<b>Space＝ショット</b> ／ <b>Enter＝ジャンプ</b>（マウス＋Space＋Enterだけで遊べます）
  </div>
</div>

<div id="result" class="screen">
  <div id="result-title"></div>
  <div id="result-bar"><div id="result-bar-a"></div></div>
  <div id="result-pcts"><span id="result-a"></span><span id="result-b"></span></div>
  <button id="rematch" class="big">もう一回</button>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./vendor/GLTFLoader.js"></script>
<script src="./vendor/SkeletonUtils.js"></script>
<script type="module" src="./src/game3d.js"></script>
</body>
</html>
